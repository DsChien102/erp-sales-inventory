targets:
  $default:
    builders:
      vet45_generator|cqrs_registrar:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_application
          import_domain: true
      vet45_generator|cqrs_infrastructure:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_application
          import_domain: true
      vet45_generator|cqrs_internal_registry:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_application
      vet45_generator|access_metadata:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_application
          access_scan_package: vet45_iam_application
          strict_access_metadata: false
      vet45_generator|module_manifest:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_infrastructure
          handler_scan_package: vet45_iam_application
      vet45_generator|cqrs_integration_event_registry:
        enabled: true
        options:
          module_name: iam
          scan_package: vet45_iam_application
          application_package: vet45_iam_application
          dispatchers:
            - id: iam
              factory_function: createGeneratedIamIntegrationEventDispatcher
              dispatcher_class: IamIntegrationEventDispatcher
              dispatcher_import: ../iam_integration_event_dispatcher.dart
              event_packages:
                - vet45_iam_integration_events
