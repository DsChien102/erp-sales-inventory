name: async_query_workspace

packages:
  - .
  - packages/async_query_flutter
  - example

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: melos exec -- dart analyze --fatal-infos
    description: Run dart analyze in all packages

  test:
    run: melos exec -- dart test
    description: Run dart tests in all packages

  test:flutter:
    run: melos exec --scope="async_query_flutter" --scope="async_query_example" -- flutter test
    description: Run Flutter widget tests
