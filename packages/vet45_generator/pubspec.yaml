name: vet45_generator
description: In-house build_runner codegen for CQRS handler registration.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  analyzer: ^8.0.0
  build: ^4.0.0
  path: ^1.9.1
  vet45_annotations: ^0.1.0
  vet45_shared_application: ^1.0.0

dev_dependencies:
  vet45_lints: ^1.0.0
  lints: ^6.0.0
  test: ^1.25.15
  own_integration_events:
    path: test/fixtures/own_integration_events
  other_integration_events:
    path: test/fixtures/other_integration_events
