name: vet45

publish_to: none

environment:
  sdk: '>=3.11.1 <4.0.0'

workspace:
  - apps/erp
  - apps/messaging_worker
  - packages/vet45_lints
  - packages/vet45_design_system
  - packages/vet45_annotations
  - packages/vet45_adapters
  - packages/vet45_generator
  - packages/vet45_shared/application
  - packages/vet45_shared/domain
  - packages/vet45_shared/infrastructure
  - packages/vet45_shared/testing
  - modules/catalog/domain
  - modules/catalog/application
  - modules/catalog/infrastructure
  - modules/catalog/integration_events
  - modules/catalog/presentation
  - modules/sales/domain
  - modules/sales/application
  - modules/sales/infrastructure
  - modules/sales/integration_events
  - modules/sales/presentation
  - modules/partner/domain
  - modules/partner/application
  - modules/partner/infrastructure
  - modules/partner/integration_events
  - modules/partner/presentation
  - modules/iam/domain
  - modules/iam/application
  - modules/iam/infrastructure
  - modules/iam/integration_events
  - modules/iam/presentation
  - modules/inventory/domain
  - modules/inventory/application
  - modules/inventory/infrastructure
  - modules/inventory/integration_events
  - modules/inventory/presentation
  - modules/costing/domain
  - modules/costing/application
  - modules/costing/infrastructure
  - modules/costing/integration_events
  - modules/costing/presentation
  - modules/dashboard/domain
  - modules/dashboard/application
  - modules/dashboard/infrastructure
  - modules/dashboard/integration_events
  - modules/dashboard/presentation
  - modules/accounting/domain
  - modules/accounting/application
  - modules/accounting/infrastructure
  - modules/accounting/integration_events
  - modules/accounting/presentation

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    env:list:
      run: ./scripts/env/vet45_env.sh list
      description: List Vet45 environments and active selection

    env:use:
      run: ./scripts/env/vet45_env.sh use
      description: Set active environment (pass id after --)

    env:use:development:
      run: ./scripts/env/vet45_env.sh use development
      description: Set active environment to development (default)

    env:use:local:
      run: ./scripts/env/vet45_env.sh use local
      description: Set active environment to local (Supabase CLI)

    env:use:staging:
      run: ./scripts/env/vet45_env.sh use staging
      description: Set active environment to staging

    env:use:production:
      run: ./scripts/env/vet45_env.sh use production
      description: Set active environment to production

    env:sync:
      run: ./scripts/env/vet45_env.sh sync
      description: Align supabase link + sync ERP + worker .env files

    env:link:
      run: ./scripts/env/vet45_env.sh link
      description: Align supabase link with active environment project ref

    env:doctor:
      run: ./scripts/env/vet45_env.sh doctor
      stdio: inherit
      description: Validate active environment configuration

    env:development:
      run: ./scripts/env/vet45_env.sh use development && ./scripts/env/vet45_env.sh sync
      description: Use development (default) and sync app env files

    env:local:
      run: ./scripts/env/vet45_env.sh use local && ./scripts/env/vet45_env.sh sync
      description: Use local Supabase and sync app env files

    debug:
      run: ./scripts/env/vet45_env.sh run erp debug
      stdio: inherit

    debug:web:
      run: ./scripts/env/vet45_env.sh run erp debug:web
      stdio: inherit

    debug:ios:
      run: ./scripts/env/vet45_env.sh run erp debug:ios
      stdio: inherit

    debug:dev:
      run: ./scripts/env/vet45_env.sh use development && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp debug
      stdio: inherit

    debug:staging:
      run: ./scripts/env/vet45_env.sh use staging && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp debug
      stdio: inherit

    debug:prod:
      run: ./scripts/env/vet45_env.sh use production && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp debug
      stdio: inherit

    build:ios:
      run: ./scripts/env/vet45_env.sh run erp build-ios
      stdio: inherit
      description: Build iOS IPA — active env (staging|production)

    build:ios:staging:
      run: ./scripts/env/vet45_env.sh use staging && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp build-ios
      stdio: inherit
      description: Build iOS IPA (staging shortcut)

    build:ios:production:
      run: ./scripts/env/vet45_env.sh use production && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp build-ios
      stdio: inherit
      description: Build iOS IPA (production shortcut)

    deploy:ios:
      run: ./scripts/env/vet45_env.sh run erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA — active env (staging|production)

    deploy:ios:staging:
      run: ./scripts/env/vet45_env.sh use staging && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA (staging shortcut)

    deploy:ios:production:
      run: ./scripts/env/vet45_env.sh use production && ./scripts/env/vet45_env.sh sync --target erp && ./scripts/env/vet45_env.sh run erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA (production shortcut)

    deploy:worker:
      run: ./scripts/env/vet45_env.sh run worker deploy
      stdio: inherit
      description: Deploy messaging worker to Railway — active env (staging|production)

    deploy:worker:staging:
      run: ./scripts/env/vet45_env.sh use staging && ./scripts/env/vet45_env.sh sync --target worker && ./scripts/env/vet45_env.sh run worker deploy
      stdio: inherit
      description: Deploy messaging worker (staging shortcut)

    deploy:worker:production:
      run: ./scripts/env/vet45_env.sh use production && ./scripts/env/vet45_env.sh sync --target worker && ./scripts/env/vet45_env.sh run worker deploy
      stdio: inherit
      description: Deploy messaging worker (production shortcut)

    codegen:
      run: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    analyze:
      exec: dart analyze --no-fatal-warnings
      packageFilters:
        dirExists: lib

    test:
      exec: dart test
      packageFilters:
        dirExists: test
        ignore:
          - erp
          - messaging_worker
          - vet45_partner_presentation
      isPrivate: true

    test:flutter:
      exec: flutter test
      packageFilters:
        dirExists: test
        scope:
          - vet45_partner_presentation
      isPrivate: true

    worker:once:
      run: ./scripts/env/vet45_env.sh run worker once
      stdio: inherit
      description: Run one messaging worker tick (requires Supabase + .env)

    worker:serve:
      run: ./scripts/env/vet45_env.sh run worker serve
      stdio: inherit
      description: Run messaging worker HTTP server locally (port 8080)

    worker:docker:
      run: ./scripts/env/vet45_env.sh run worker docker
      stdio: inherit
      description: Run messaging worker in Docker (Railway-like AOT binary)

    worker:verify:
      run: ./apps/messaging_worker/scripts/verify_build.sh
      description: AOT compile worker and optional Docker image build

  repository:
    type: gitlab
    origin: https://gitlab.hamsa.co
    owner: vet45
    name: vet45
