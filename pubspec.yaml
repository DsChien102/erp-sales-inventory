name: vet45

publish_to: none

environment:
  sdk: '>=3.11.1 <4.0.0'

workspace:
  - apps/erp
  - apps/admin
  - apps/messaging_worker
  - packages/vet45_lints
  - packages/vet45_design_system
  - packages/vet45_annotations
  - packages/vet45_adapters
  - packages/vet45_resend
  - packages/vet45_misa
  - packages/vet45_generator
  - packages/vet45_shared/application
  - packages/vet45_shared/domain
  - packages/vet45_shared/infrastructure
  - packages/vet45_shared/testing
  - modules/catalog/domain
  - modules/catalog/application
  - modules/catalog/infrastructure
  - modules/catalog/integration_events
  - modules/sales/domain
  - modules/sales/application
  - modules/sales/infrastructure
  - modules/sales/integration_events
  - modules/iam/domain
  - modules/iam/application
  - modules/iam/infrastructure
  - modules/iam/integration_events
  - modules/partner/domain
  - modules/partner/application
  - modules/partner/infrastructure
  - modules/partner/integration_events
  - modules/pricing/domain
  - modules/pricing/application
  - modules/pricing/infrastructure
  - modules/inventory/domain
  - modules/inventory/application
  - modules/inventory/infrastructure
  - modules/inventory/integration_events
  - modules/costing/domain
  - modules/costing/application
  - modules/costing/infrastructure
  - modules/costing/integration_events
  - modules/dashboard/domain
  - modules/dashboard/application
  - modules/dashboard/infrastructure
  - modules/dashboard/integration_events
  - modules/accounting/domain
  - modules/accounting/application
  - modules/accounting/infrastructure
  - modules/accounting/integration_events
  - tools/vet45_env
  - tools/vet45_supabase_migrate

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    env:build:
      run: dart run tools/vet45_env/bin/build_aot.dart
      description: Compile vet45_env AOT binary to .vet45/bin (Unix/Windows)

    env:init:
      run: dart run tools/vet45_env/bin/run.dart init
      description: Scaffold .vet45/profiles/<profileId>/ from target keys (pass id after --)

    env:example:
      run: dart run tools/vet45_env/bin/run.dart example
      description: Generate .env.example from vet45.target.json (or --check)

    env:list:
      run: dart run tools/vet45_env/bin/run.dart list
      description: List profiles, environments, and active selection

    profile:list:
      run: dart run tools/vet45_env/bin/run.dart profile list
      description: List configuration profiles

    profile:use:
      run: dart run tools/vet45_env/bin/run.dart profile use
      description: Set active profile (pass id after --)

    profile:init:
      run: dart run tools/vet45_env/bin/run.dart init
      description: Alias of env:init — scaffold profiles from target keys (pass id after --)

    env:use:
      run: dart run tools/vet45_env/bin/run.dart use
      description: Set active environment (pass id after --)

    env:use:development:
      run: dart run tools/vet45_env/bin/run.dart use development
      description: Set active environment to development (default)

    env:use:local:
      run: dart run tools/vet45_env/bin/run.dart use local
      description: Set active environment to local (Supabase CLI)

    env:use:staging:
      run: dart run tools/vet45_env/bin/run.dart use staging
      description: Set active environment to staging

    env:use:production:
      run: dart run tools/vet45_env/bin/run.dart use production
      description: Set active environment to production

    env:sync:
      run: dart run tools/vet45_env/bin/run.dart sync
      description: Align supabase link + sync ERP + worker .env files

    env:switch:
      run: dart run tools/vet45_env/bin/run.dart switch
      description: Switch profile/env, link, and sync (pass args after --)

    env:tui:
      run: dart run tools/vet45_env/bin/run.dart tui
      stdio: inherit
      description: Open interactive vet45 TUI (nocterm)

    env:link:
      run: dart run tools/vet45_env/bin/run.dart link
      description: Align supabase link with active environment project ref

    supabase:
      run: dart run tools/vet45_env/bin/run.dart supabase
      stdio: inherit
      description: Run supabase CLI with active profile auth.env token

    env:doctor:
      run: dart run tools/vet45_env/bin/run.dart doctor
      stdio: inherit
      description: Validate active environment configuration

    env:development:
      run: dart run tools/vet45_env/bin/run.dart use-and-sync development
      description: Use development (default) and sync app env files

    env:local:
      run: dart run tools/vet45_env/bin/run.dart use-and-sync local
      description: Use local Supabase and sync app env files

    debug:
      run: dart run tools/vet45_env/bin/run.dart run erp debug
      stdio: inherit

    debug:web:
      run: dart run tools/vet45_env/bin/run.dart run erp debug:web
      stdio: inherit

    debug:ios:
      run: dart run tools/vet45_env/bin/run.dart run erp debug:ios
      stdio: inherit

    debug:dev:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run development erp debug
      stdio: inherit

    debug:staging:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run staging erp debug
      stdio: inherit

    debug:prod:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run production erp debug
      stdio: inherit

    build:ios:
      run: dart run tools/vet45_env/bin/run.dart run erp build-ios
      stdio: inherit
      description: Build iOS IPA — active env (staging|production)

    build:ios:staging:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run staging erp build-ios
      stdio: inherit
      description: Build iOS IPA (staging shortcut)

    build:ios:production:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run production erp build-ios
      stdio: inherit
      description: Build iOS IPA (production shortcut)

    deploy:ios:
      run: dart run tools/vet45_env/bin/run.dart run erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA — active env (staging|production)

    deploy:ios:staging:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run staging erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA (staging shortcut)

    deploy:ios:production:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run production erp deploy-ios
      stdio: inherit
      description: Build + upload iOS IPA (production shortcut)

    deploy:worker:
      run: dart run tools/vet45_env/bin/run.dart run worker deploy
      stdio: inherit
      description: Deploy messaging worker to Railway — active env (staging|production)

    deploy:worker:staging:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run staging worker deploy
      stdio: inherit
      description: Deploy messaging worker (staging shortcut)

    deploy:worker:production:
      run: dart run tools/vet45_env/bin/run.dart use-sync-run production worker deploy
      stdio: inherit
      description: Deploy messaging worker (production shortcut)

    codegen:
      run: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    analyze:
      exec: dart analyze --no-fatal-warnings
      packageFilters:
        dirExists: lib

    test:
      exec: dart test
      packageFilters:
        dirExists: test
        ignore:
          - erp
          - messaging_worker
      isPrivate: true

    worker:once:
      run: dart run tools/vet45_env/bin/run.dart run worker once
      stdio: inherit
      description: Run one messaging worker tick (requires Supabase + .env)

    worker:serve:
      run: dart run tools/vet45_env/bin/run.dart run worker serve
      stdio: inherit
      description: Run messaging worker HTTP server locally (port 8080)

    worker:docker:
      run: dart run tools/vet45_env/bin/run.dart run worker docker
      stdio: inherit
      description: Run messaging worker in Docker (AOT; image tag = active env)

    worker:verify:
      run: ./apps/messaging_worker/scripts/verify_build.sh
      description: AOT compile worker and optional Docker image build

    design-system:example:
      run: cd packages/vet45_design_system/example && flutter pub get && flutter run
      stdio: inherit
      description: Run vet45_design_system preview example app

    design-system:example:web:
      run: cd packages/vet45_design_system/example && flutter pub get && flutter run -d chrome
      stdio: inherit
      description: Run vet45_design_system preview example app on Chrome

    design-system:example:ios:
      run: cd packages/vet45_design_system/example && flutter pub get && flutter run -d ios
      stdio: inherit
      description: Run vet45_design_system preview example app on iOS simulator

    migrate:promote-drafts:
      run: dart run tools/vet45_supabase_migrate/bin/promote_drafts.dart
      description: Promote supabase/migrations/_drafts SQL files to timestamped migrations

    migrate:seed-registry:
      run: dart run tools/vet45_supabase_migrate/bin/seed_registry.dart
      description: Scan migrations and build supabase/migrations/REGISTRY.yaml

    migrate:verify-policy:
      run: dart run tools/vet45_supabase_migrate/bin/verify_migration_policy.dart
      description: Verify cohesive migration policy (Kind, Touches, REGISTRY)

  repository:
    type: gitlab
    origin: https://gitlab.hamsa.co
    owner: vet45
    name: vet45
