name: c45

publish_to: none

environment:
  sdk: '>=3.11.1 <4.0.0'

workspace:
  - apps/erp
  - packages/c45_lints
  - packages/c45_design_system
  - packages/c45_annotations
  - packages/c45_shared/application
  - packages/c45_shared/domain
  - packages/c45_shared/infrastructure
  - packages/c45_shared/testing

dev_dependencies:
  melos: ^7.8.0

melos:
  scripts:
    codegen:
      run: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    analyze:
      exec: dart analyze --no-fatal-warnings
      packageFilters:
        dirExists: lib

    test:
      exec: dart test
      packageFilters:
        dirExists: test
        ignore:
          - erp
      isPrivate: true

    design-system:example:
      run: cd packages/c45_design_system/example && flutter pub get && flutter run
      stdio: inherit
      description: Run c45_design_system preview example app

    design-system:example:web:
      run: cd packages/c45_design_system/example && flutter pub get && flutter run -d chrome
      stdio: inherit
      description: Run c45_design_system preview example app on Chrome

    design-system:example:ios:
      run: cd packages/c45_design_system/example && flutter pub get && flutter run -d ios
      stdio: inherit
      description: Run c45_design_system preview example app on iOS simulator

  repository:
    type: github
    origin: https://github.com
    owner: DsChien102
    name: erp-sales-inventory
