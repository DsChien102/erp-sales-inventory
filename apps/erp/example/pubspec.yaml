name: erp_presentation_example
description: Preview catalog for ERP feature presentation widgets.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  erp:
    path: ../
  vet45_design_system:
    path: ../../../packages/vet45_design_system
  vet45_shared_testing:
    path: ../../../packages/vet45_shared/testing
  vet45_einvoice_domain:
    path: ../../../modules/einvoice/domain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  async_query:
    path: ../../../packages/vet45_async_query
  async_query_flutter:
    path: ../../../packages/vet45_async_query/packages/async_query_flutter
  vet45_adapters:
    path: ../../../packages/vet45_adapters
  vet45_annotations:
    path: ../../../packages/vet45_annotations
  vet45_design_system:
    path: ../../../packages/vet45_design_system
  vet45_einvoice_application:
    path: ../../../modules/einvoice/application
  vet45_einvoice_domain:
    path: ../../../modules/einvoice/domain
  vet45_einvoice_infrastructure:
    path: ../../../modules/einvoice/infrastructure
  vet45_einvoice_integration_events:
    path: ../../../modules/einvoice/integration_events
  vet45_einvoice_presentation:
    path: ../../../modules/einvoice/presentation
  vet45_lints:
    path: ../../../packages/vet45_lints
  vet45_misa:
    path: ../../../packages/vet45_misa
  vet45_partner_integration_events:
    path: ../../../modules/partner/integration_events
  vet45_sales_integration_events:
    path: ../../../modules/sales/integration_events
  vet45_shared_application:
    path: ../../../packages/vet45_shared/application
  vet45_shared_domain:
    path: ../../../packages/vet45_shared/domain
  vet45_shared_infrastructure:
    path: ../../../packages/vet45_shared/infrastructure
  vet45_shared_testing:
    path: ../../../packages/vet45_shared/testing

flutter:
  uses-material-design: true
