# Local dev stack (messaging worker). Supabase stays on `supabase start` (CLI-managed).
#
#   supabase start
#   melos run env:development   # or env:local for CLI-only
#   melos run worker:docker
#
services:
  messaging-worker:
    build:
      context: .
      dockerfile: apps/messaging_worker/Dockerfile
    image: vet45/messaging-worker:local
    env_file:
      - ${WORKER_ENV_FILE:-apps/messaging_worker/.env}
    environment:
      SUPABASE_URL: ${WORKER_SUPABASE_URL:-http://host.docker.internal:54321}
      PORT: "8080"
    ports:
      - "${WORKER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
