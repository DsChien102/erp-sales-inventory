# Messaging worker — one image, runtime env from vet45-generated env_file.
#
#   vet45 switch --env local        && melos run worker:docker   # supabase start
#   vet45 switch --env development  && melos run worker:docker   # remote .env
#   vet45 switch --env staging      && melos run worker:docker   # .env.staging
#
# Env `local` also loads docker-compose.local.yml (host.docker.internal rewrite).
# Prefer: melos run worker:docker  (sets WORKER_* via vet45.target.json).
services:
  messaging-worker:
    build:
      context: .
      dockerfile: apps/messaging_worker/Dockerfile
    image: vet45/messaging-worker:${WORKER_IMAGE_TAG:-local}
    env_file:
      - ${WORKER_ENV_FILE:-apps/messaging_worker/.env}
    environment:
      PORT: "8080"
    ports:
      - "${WORKER_PORT:-8080}:8080"
    restart: unless-stopped
