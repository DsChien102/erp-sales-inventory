quantityModel:
  authoritativeInputs: [accepted, quarantine, damaged, rejected]
  labels: [Đạt, Cách ly, Hỏng, Từ chối]
  display: DS v2 / Key-value Row
  editor: VNumericKeypadSheet
  totalInspected: {editable: false, formula: accepted + quarantine + damaged + rejected}
  acceptedPhysical: {editable: false, formula: accepted + quarantine + damaged}
  rejectedEffect: NEVER_ENTERS_INVENTORY
guards:
  - one Receipt = one Supplier
  - no Supplier/Product quick-create
  - one UI receipt item = Product + transaction UOM
  - Document UOM source-owned
  - Quick UOM asks only when multiple valid UOMs
  - Quick always requires approval
  - maker and approver are separate actors
  - UNKNOWN uses same operation identity; no blind retry

receiptSemanticLock:
  sourceAuthority: source_line_id + source_line_version + remaining_receivable_qty + transaction_uom + conversion_snapshot
  receiptBusinessDate: tenant_business_date_server_owned_read_only
  quickEvidence: 1+ delivery evidence refs via Shared Attachment Policy
  quickOwnershipAssertion: structured_capability_gated
  riskBasis: accepted_physical_base_qty * authoritative_price_per_base_uom
  lotDatePrecision: [DAY, MONTH, YEAR]
  sourceChange: explicit_confirmation_and_safe_reset
  quickZeroAcceptedPhysical: BLOCK_SUBMIT
