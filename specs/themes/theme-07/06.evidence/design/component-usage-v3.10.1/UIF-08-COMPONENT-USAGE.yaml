uiAuthority: Figma Design System v2.0.3
figmaDsLock: ../FIGMA-DS-LOCK.json
version: 3.10.0
uif: UIF-08
bj: BJ-08
status: BJ08_DEEP_REVIEW_ALIGNED_v3.10.0
hardRules:
  blindCount: book quantity, variance and proxies absent from SCR-044 DOM before FIRST submit
  physicalKey: Product + physical stock state + LOT/non-LOT; quantity uses base UOM
  valuationState: never exposed as physical count dimension; unresolved/mixed valuation blocks open
  cancellation: ACT-09-CANCEL only in SCR-044/SCR-045 session context
  zeroVariance: complete and unlock without approval
  recount: immutable rounds; request-review creates successor round/case
  approver: independent contributor-exclusion; SCR-046 read-only non-zero variance only
  financial: restricted risk/value omitted server-side unless authorized
  unknown: same command/session identity; handoff BJ17; no blind retry
screenComponents:
  SCR-042: {surface: list, visibleMutations: []}
  SCR-043: {surface: form, visibleMutations: [ACT-09-OPEN]}
  SCR-044: {surface: blind-count form, visibleMutations: [ACT-09-SUBMIT, ACT-09-CANCEL when cancellable]}
  SCR-045: {surface: recount form, visibleMutations: [ACT-09-SUBMIT, ACT-09-CANCEL when cancellable]}
  SCR-046: {surface: approval detail, visibleMutations: [ACT-09-APPROVE decision]}
  SCR-047: {surface: result, visibleMutations: []}
tokenPolicy: semantic variables first; no arbitrary color; disabled parent opacity=0.4
iconPolicy: approved VET45 registry only
