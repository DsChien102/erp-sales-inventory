uiAuthority: Figma Design System v2.0.3
figmaDsLock: ../FIGMA-DS-LOCK.json
version: 3.9.1
uif: UIF-01
bj: BJ-01
viewport: [402, 874]
componentSelectionPriority:
  - canonical_v_component_if_semantically_valid
  - canonical_existing_non_v_component
  - existing_pattern_or_template
  - layout_composition_of_existing_ds_assets
  - new_component_after_proven_reusable_gap_only
hardRules:
  - one_list_no_tabs
  - no_card_per_product
  - availability_is_single_primary_outcome
  - no_custom_availability_component
  - read_only_no_mutation
  - protected_data_omitted_from_dom
  - no_redundant_theme_wrapper_if_ds_assets_represent_anatomy
  - aligned_quantity_summary_uses_key_value_row
  - vbanner_height_is_content_driven
  - typography_is_component_owned_not_number_inferred
surfaces:
  SCR-001:
    template: Mobile / Nested List
    appBar: {component: VAppBar}
    search:
      component: DS v2 / Search & Filter Header
      node: "547:2306"
      props: {layout: Search}
      composedFrom: [VSearchBar]
    quickFilters:
      component: VChip
      node: "522:7449"
      layoutOnlyWrapper: true
      themeComponent: none
    productRow:
      component: DS v2 / List Row
      node: "525:519"
      themeComponent: none
    empty: {component: VEmptyState}
    stale: [VBanner, VButton]
  SCR-003:
    template: Mobile / Detail
    appBar: {component: VAppBar}
    availability:
      primary:
        component: DS v2 / Key-value Row
        node: "525:358"
        props: {state: Emphasis, label: Khả dụng}
      supporting:
        component: DS v2 / Key-value Row
        node: "525:358"
        props: {state: Default}
        rows: [Tồn vật lý, Đủ điều kiện bán, Đã giữ, eligibility_breakdown_when_nonzero]
      layoutOnlyWrapper: true
      themeComponent: none
    lotRow:
      component: DS v2 / List Row
      node: "525:519"
      themeComponent: none
    provenanceEntry:
      component: DS v2 / List Row
      node: "525:519"
      themeComponent: none
    contextSheet:
      component: VBottomSheet
      node: "4695:6353"
      props: {showTitle: true}
mutationActions: []
iconPolicy: approved VET45 registry only
tokenPolicy: semantic variables and canonical text styles first
