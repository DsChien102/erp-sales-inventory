    - "Disabled state uses Opacity/Disabled = 0.4; không tạo tone disabled riêng."
    - "Không dùng badge thay cho metadata/nguồn; badge chỉ biểu đạt state có nghĩa."
    - "Không biến mỗi nhóm thông tin thành Card; ưu tiên Row/section/grouped summary đúng semantic."
    - "BJ14 costing method là read-only theo tenant policy; không render selector."
    - "Metadata kỹ thuật chỉ ở Inspect/audit, không nằm trong Product UI."
