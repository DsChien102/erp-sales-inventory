sharedScreenModes:
  SCR-014:
    modes:
      UIF-03: INITIAL_VALUATION_QUEUE
    note: UIF-03 owns initial valuation queue; UIF-13 moved to dedicated SCR-085 in v1.4.5.
  SCR-015:
    modes:
      UIF-03: INITIAL_SCOPE_AND_EVIDENCE
    note: UIF-03 owns identified valuation slice selection; UIF-13 moved to dedicated SCR-086 in v1.4.5.
  SCR-017:
    modes:
      UIF-03: DIRECT_VALUATION_REVIEW
    note: UIF-03 direct-valuation review only; UIF-13 moved to dedicated SCR-088 in v1.4.5.
  SCR-019:
    modes:
      UIF-03: DIRECT_VALUATION_RESULT
    note: UIF-03 direct-valuation result only; UIF-13 moved to dedicated SCR-089 in v1.4.5.
  SCR-036:
    modes:
      UIF-07: RTV
      UIF-09: STATE_CHANGE
      UIF-10: DISPOSAL
    note: Same inventory triage list; labels/filters use active operation context.
  SCR-037:
    modes:
      UIF-07: RTV
      UIF-09: STATE_CHANGE
      UIF-10: DISPOSAL
    note: Evidence/detail is canonical; action availability comes from active context.
  SCR-038:
    modes:
      UIF-07: STATE_PREPARE
      UIF-09: PREPARE_OR_APPROVAL
    note: Maker and approver modes are mutually exclusive; ACT-08-STATE is system-owned after route.
  SCR-040:
    modes:
      UIF-10: PREPARE_APPROVAL_COMPLETION
    note: Three mutually-exclusive modes; approval never decrements physical inventory.
  SCR-041:
    modes:
      UIF-07: RTV_RESULT
      UIF-09: STATE_RESULT
      UIF-10: DISPOSAL_RESULT
    note: One result layout with operation_type-specific summary/copy.
  SCR-052:
    modes:
      UIF-11: ROUTE_DEPENDENT_CANCEL_OR_CORRECTION
    note: Cancel and correction are mutually exclusive route modes; Product UI never presents both as simultaneous actions.
  SCR-054:
    modes:
      UIF-01: STOCK_CARD_QUERY
      UIF-15: REPORT_QUERY
    note: Known product/scope is prefilled when entry context supplies it.
  SCR-055:
    modes:
      UIF-01: STOCK_CARD_RESULTS
      UIF-15: STOCK_CARD_RESULTS
    note: Canonical movement result list.
  SCR-056:
    modes:
      UIF-01: MOVEMENT_DETAIL
      UIF-09: MOVEMENT_DETAIL
      UIF-15: MOVEMENT_DETAIL
    note: Canonical movement detail; finance fields mask by permission.
  SCR-057:
    modes:
      UIF-01: SOURCE_TRACE
      UIF-15: SOURCE_TRACE
    note: Canonical evidence timeline.
  SCR-070:
    modes:
      UIF-12: APPROVAL_ONLY
    note: Approver decides; commit is system-owned after approval.
  SCR-071:
    modes:
      UIF-12: AUTO_COMMIT_RESULT
    note: Processing/result owns commit finality; no user commit CTA.
  SCR-078:
    modes:
      UIF-16: RECON_CASES
      UIF-17: UNKNOWN_CASES
    note: Same case list; prioritization/copy changes by entry reason.
  SCR-079:
    modes:
      UIF-16: INVESTIGATION_EVIDENCE
      UIF-17: UNKNOWN_EVIDENCE
    note: Evidence timeline, not a technical retry log.
  SCR-080:
    modes:
      UIF-16: PROJECTION_RECOVERY
      UIF-17: SAME_IDENTITY_FINALITY
    note: System recommends only a contract-valid business path; no raw replay/rebuild/source selector is rendered.
  SCR-082:
    modes:
      UIF-16: RECON_REVIEW
      UIF-17: FINALITY_REVIEW
    note: Review only business facts required for close/finality; same identity and no-duplicate-mutation remain visible invariants.
  SCR-083:
    modes:
      UIF-16: RECON_RESULT
      UIF-17: RECOVERY_RESULT
    note: Result preserves source operation/case links; unresolved escalation never exposes blind retry/new-operation mutation.
forbidden:
- raw design token in Screen Contract
- raw Lucide icon without VIcons mapping
- unmapped visible component
- cloned shared-screen implementation

